# =====================================================================================================
# PLANTILLA — build-testing.yml (GitHub Actions → GHCR → VPS de testing por SSH)
#
# Se copia a `.github/workflows/build-testing.yml` de CADA repo de aplicación (los 7 backends y
# frontend_rrhh). Las copias por repo las genera `workflows/render.sh`. Cambian 4 valores (bloque `env`):
#   IMAGE_NAME          fibex-rrhh-<servicio>  (debe coincidir con docker-compose.dokploy.yml)
#   SEED_SUPPORTED      "true" en backends (stage `build` = imagen de seed), "false" en el frontend
#   SEED_SERVICE        nombre del seed en vps-deploy.sh (identity, people, ...); vacío en el frontend
#   VITE_API_BASE_URL   solo lo usa el frontend (build-arg); los backends lo ignoran
#
# Qué hace:
#   push a develop → build multi-stage (`--target runtime`) y, en backends, también la imagen de seed
#   (`--target build`), con caché de BuildKit en GitHub Actions (type=gha) → push a GHCR con tags
#   `testing`, `develop`, `sha-<12>` y `testing-seed`, `sha-<12>-seed` → despliegue en la VPS por SSH
#   (`ssh ... deploy` → fibex-infra/scripts/vps-deploy.sh: flock, git reset a develop, pull, up -d).
#   El push NO siembra (decisión: seeds solo manuales).
#   workflow_dispatch → lo mismo; `deploy` desactiva el despliegue y `run_seed` siembra ESTE servicio
#   tras desplegar (`ssh ... seed <servicio>`).
#
# Secrets del repo (Settings → Secrets and variables → Actions; guía en fibex-infra/docs/deploy-testing-vps.md):
#   VPS_HOST             IP o nombre de la VPS (148.113.178.92)
#   VPS_USER             usuario SSH (por defecto ubuntu)
#   VPS_SSH_PRIVATE_KEY  clave privada ed25519 de CI (su pública va forzada a ci-ssh-entry.sh)
#   VPS_SSH_KNOWN_HOSTS  salida de `ssh-keyscan -t ed25519 <VPS_HOST>` (verificación del host)
#   VPS_SSH_PORT         opcional (22)
# Sin VPS_HOST/VPS_SSH_PRIVATE_KEY se publica la imagen y el despliegue se omite con un aviso.
# El push a GHCR usa el GITHUB_TOKEN del propio workflow (permiso packages: write): no hace falta PAT.
# =====================================================================================================
name: build-testing

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Desplegar en la VPS de testing al terminar"
        type: boolean
        default: true
      run_seed:
        description: "Tras desplegar, ejecutar el seed de este servicio (solo backends)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

# CONCURRENCIA. Nivel 1, el run completo por repo y rama: un push nuevo a develop CANCELA el run
# anterior aún en curso (build o espera de despliegue). Con merges seguidos solo se publica y despliega
# el último commit; nunca se acumulan builds ni redeploys de commits ya superados.
concurrency:
  group: build-testing-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fibex-rrhh-self-service
  SEED_SUPPORTED: "true"
  SEED_SERVICE: "self-service"
  VITE_API_BASE_URL: /api/v1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      image: ${{ steps.vars.outputs.image }}
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Variables
        id: vars
        shell: bash
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${REGISTRY}/${owner}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "created=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Imagen de runtime (la que despliega la VPS). Una sola plataforma (la VPS es amd64) y sin
      # attestations: el manifiesto queda simple y el pull en la VPS no descarga artefactos de más.
      - name: Build & push (runtime)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
          tags: |
            ${{ steps.vars.outputs.image }}:testing
            ${{ steps.vars.outputs.image }}:develop
            ${{ steps.vars.outputs.image }}:sha-${{ steps.vars.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ steps.vars.outputs.short_sha }}
            org.opencontainers.image.created=${{ steps.vars.outputs.created }}
          # Caché de capas de BuildKit en GitHub Actions. `mode=max` guarda también las stages
          # intermedias (deps, prod-deps): un push sin cambios en yarn.lock no reinstala dependencias.
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}
          cache-to: type=gha,scope=${{ env.IMAGE_NAME }},mode=max

      # Imagen de seed (stage `build`: devDependencies + dist). En CADA build de backend, para que
      # `:testing-seed` nunca vaya por detrás del esquema que migra `:testing`.
      - name: Build & push (seed)
        if: ${{ env.SEED_SUPPORTED == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: build
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.vars.outputs.image }}:testing-seed
            ${{ steps.vars.outputs.image }}:sha-${{ steps.vars.outputs.short_sha }}-seed
          # Reutiliza las capas `deps` del build de runtime y las propias de la stage `build`.
          cache-from: |
            type=gha,scope=${{ env.IMAGE_NAME }}
            type=gha,scope=${{ env.IMAGE_NAME }}-seed
          cache-to: type=gha,scope=${{ env.IMAGE_NAME }}-seed,mode=max

      - name: Resumen
        shell: bash
        run: |
          {
            echo "### Imagen publicada"
            echo "- \`${{ steps.vars.outputs.image }}:testing\`"
            echo "- \`${{ steps.vars.outputs.image }}:sha-${{ steps.vars.outputs.short_sha }}\` (rollback: \`<SVC>_IMAGE_TAG=sha-${{ steps.vars.outputs.short_sha }}\` en el env de la VPS)"
            if [ "${SEED_SUPPORTED}" = "true" ]; then echo "- \`${{ steps.vars.outputs.image }}:testing-seed\`"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    if: ${{ github.event_name == 'push' || inputs.deploy }}
    runs-on: ubuntu-24.04
    # Incluye la espera al candado de la VPS si otro repo está desplegando (vps-deploy.sh usa flock).
    timeout-minutes: 45
    # Nivel 2: serializa los despliegues de ESTE repo y deja como mucho uno pendiente. Entre repos
    # distintos serializa el flock de la VPS; como `pull` trae siempre lo último, un despliegue que
    # esperó al candado despliega también lo que publicaron los demás repos.
    concurrency:
      group: vps-deploy-testing
      cancel-in-progress: false
    env:
      # Ventana para agrupar merges seguidos: si llega otro push a develop en este repo durante la
      # espera, este run se cancela (nivel 1) y solo despliega el último. Variable de repo
      # DEPLOY_DEBOUNCE_S.
      DEPLOY_DEBOUNCE_S: ${{ vars.DEPLOY_DEBOUNCE_S || '45' }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
    steps:
      - name: Preparar SSH
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VPS_HOST}" ] || [ -z "${VPS_SSH_PRIVATE_KEY}" ]; then
            echo "::warning::Sin secrets VPS_HOST/VPS_SSH_PRIVATE_KEY: imagen publicada, despliegue omitido (ver fibex-infra/docs/deploy-testing-vps.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "${VPS_SSH_KNOWN_HOSTS}" ]; then
            echo "::error::Falta el secret VPS_SSH_KNOWN_HOSTS (salida de ssh-keyscan de la VPS): sin él no se verifica la identidad del host."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "${VPS_SSH_PRIVATE_KEY}" > ~/.ssh/fibex_ci && chmod 600 ~/.ssh/fibex_ci
          printf '%s\n' "${VPS_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Ventana de agrupación (debounce)
        if: ${{ steps.ssh.outputs.enabled == 'true' && github.event_name == 'push' }}
        shell: bash
        run: sleep "${DEPLOY_DEBOUNCE_S}"

      - name: Desplegar en la VPS
        if: ${{ steps.ssh.outputs.enabled == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/fibex_ci -p "${VPS_SSH_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            "${VPS_USER:-ubuntu}@${VPS_HOST}" deploy

      - name: Sembrar este servicio
        if: ${{ steps.ssh.outputs.enabled == 'true' && github.event_name == 'workflow_dispatch' && inputs.run_seed && env.SEED_SERVICE != '' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/fibex_ci -p "${VPS_SSH_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            "${VPS_USER:-ubuntu}@${VPS_HOST}" "seed ${SEED_SERVICE}"
